<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 43 570 478" aria-label="핀홀 카메라 닮은 삼각형과 PnP">
        <g font-family="Pretendard, Noto Sans CJK KR, sans-serif" fill="#1F1C19">
          <!-- 카메라 -->
          <rect x="34" y="128" width="58" height="44" rx="6" fill="#1F1C19"/>
          <circle cx="100" cy="150" r="7" fill="#D93A24"/>
          <text x="63" y="196" font-size="19" text-anchor="middle" fill="#58524A">웹캠</text>
          <!-- 광선 -->
          <line x1="100" y1="150" x2="520" y2="50" stroke="#8D8579" stroke-width="2"/>
          <line x1="100" y1="150" x2="520" y2="250" stroke="#8D8579" stroke-width="2"/>
          <!-- 이미지면 -->
          <line x1="220" y1="96" x2="220" y2="204" stroke="#1F1C19" stroke-width="3"/>
          <line x1="220" y1="121.4" x2="220" y2="178.6" stroke="#D93A24" stroke-width="7"/>
          <text x="232" y="140" font-size="19" font-weight="900" fill="#D93A24">p</text>
          <text x="232" y="162" font-size="17" fill="#58524A">사진 속 크기(px)</text>
          <!-- 마커 -->
          <rect x="514" y="50" width="12" height="200" fill="#1F1C19"/>
          <text x="540" y="146" font-size="19" font-weight="900">s</text>
          <text x="540" y="168" font-size="17" fill="#58524A">0.15 m</text>
          <!-- 치수 -->
          <line x1="100" y1="232" x2="220" y2="232" stroke="#1F1C19" stroke-width="1.5"/>
          <line x1="100" y1="226" x2="100" y2="238" stroke="#1F1C19" stroke-width="1.5"/><line x1="220" y1="226" x2="220" y2="238" stroke="#1F1C19" stroke-width="1.5"/>
          <text x="160" y="258" font-size="19" text-anchor="middle"><tspan font-weight="900">f</tspan> 초점거리 955 px</text>
          <line x1="100" y1="282" x2="520" y2="282" stroke="#1F1C19" stroke-width="1.5"/>
          <line x1="100" y1="276" x2="100" y2="288" stroke="#1F1C19" stroke-width="1.5"/><line x1="520" y1="276" x2="520" y2="288" stroke="#1F1C19" stroke-width="1.5"/>
          <text x="310" y="306" font-size="19" text-anchor="middle"><tspan font-weight="900">Z</tspan> 거리</text>
          <!-- 식 -->
          <text x="300" y="352" font-size="34" font-weight="900" text-anchor="middle">Z = f × s ÷ p</text>
          <text x="300" y="380" font-size="19" text-anchor="middle" fill="#58524A">955 × 0.15 ÷ 72 px ≈ 2.0 m · 멀수록 작게 찍힘</text>
          <!-- PnP -->
          <line x1="20" y1="404" x2="580" y2="404" stroke="#D8CFBF" stroke-width="1.5"/>
          <polygon points="52,438 118,428 126,484 46,490" fill="none" stroke="#1F1C19" stroke-width="3"/>
          <g fill="#D93A24"><circle cx="52" cy="438" r="6"/><circle cx="118" cy="428" r="6"/><circle cx="126" cy="484" r="6"/><circle cx="46" cy="490" r="6"/></g>
          <text x="86" y="516" font-size="17" text-anchor="middle" fill="#58524A">모서리 4개</text>
          <text x="168" y="466" font-size="26" text-anchor="middle">→</text>
          <rect x="196" y="440" width="76" height="38" fill="#1F1C19"/>
          <text x="234" y="466" font-size="19" font-weight="900" text-anchor="middle" fill="#fff">PnP</text>
          <text x="294" y="466" font-size="26" text-anchor="middle">→</text>
          <text x="318" y="456" font-size="18" font-weight="900">거리 x · y · z + 방향</text>
          <text x="318" y="480" font-size="17" fill="#58524A">카메라 기준 위치와 마커의 회전</text>
        </g>
      </svg>
