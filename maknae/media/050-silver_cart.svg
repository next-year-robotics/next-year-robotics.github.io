<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
  <title id="title">보행 보조와 짐 운반을 분리하는 구조</title>
  <desc id="desc">왼쪽은 앞쪽 높은 수납함에 실은 짐으로 실버카의 무게중심이 이동하는 예시다. 오른쪽은 막내가 짐을 따로 싣고 어르신은 지팡이를 짚고 걷는다.</desc>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#E3342F"/>
    </marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8.5" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#77736C"/>
    </marker>
    <g id="bag" stroke="#151515" stroke-width="2.5" stroke-linejoin="round">
      <path d="M19 22v-9a12 12 0 0124 0v9" fill="none"/>
      <path d="M8 22h46l6 52H2z" fill="#D9C0A5"/>
      <path d="M41 22h13l6 52H44z" fill="#C3A58C"/>
    </g>
  </defs>
  <rect x="0" y="0" width="1040" height="540" fill="#FBFAF7"/>
  <path d="M520 50v431M45 418h428m87 0h435" fill="none" stroke="#D6D4CE" stroke-width="2"/>
  <g font-family="Pretendard, Noto Sans CJK KR, NanumGothic, sans-serif" fill="#151515">
    <text x="55" y="85" font-size="29" font-weight="700">실버카에 짐을 실으면</text>
    <text x="565" y="85" font-size="29" font-weight="700">짐을 막내에 따로 실으면</text>
    <text x="55" y="125" font-size="20" fill="#55534E">보행 보조와 짐 운반을 한 기구가 맡음</text>
    <text x="565" y="125" font-size="20" fill="#55534E">어르신은 지팡이로 균형을 잡음</text>
    <text x="262" y="183" font-size="19" font-weight="700" fill="#E3342F">무게중심 이동</text>
    <text x="56" y="480" font-size="17" fill="#77736C">짐을 앞쪽 높은 곳에 실었을 때의 예시</text>
    <text x="565" y="480" font-size="17" fill="#77736C">짐은 막내에 싣고, 손에는 지팡이만</text>
  </g>
  <g stroke="#151515" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 250h37l100 138m-40-86-55 86m7-37h132" fill="none"/>
    <path d="M220 264h119l-7 44h-99z" fill="#D6D4CE" stroke-width="3"/>
    <path d="M335 306l21 77M241 308l-49 76" fill="none"/>
    <path d="M226 279h107m-104 15h102" fill="none" stroke="#8F8C85" stroke-width="2"/>
