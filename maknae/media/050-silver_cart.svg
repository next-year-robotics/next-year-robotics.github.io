    <circle cx="358" cy="397" r="19" fill="#FBFAF7"/>
    <circle cx="187" cy="397" r="5" fill="#151515" stroke="none"/>
    <circle cx="358" cy="397" r="5" fill="#151515" stroke="none"/>
  </g>
