<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>막내 MAKNAE — Next Year Robotics</title>
  <meta name="description" content="혼자, 6개월, 종잣돈 100만 원으로 만든 돌봄 로봇 막내의 시연과 제작 기록.">
  <link rel="canonical" href="https://next-year-robotics.github.io/maknae/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="presentation.css">
  <link rel="stylesheet" href="web.css">
</head>
<body>
  <a class="skip-link" href="#story">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="../#maknae"><img src="../favicon.svg" alt="">Next Year Robotics</a>
      <nav id="chapters" aria-label="목차"></nav>
    </div>
  </header>
  <main id="story"><p id="story-status" role="status">제작 기록을 불러오는 중입니다.</p></main>
  <template id="calendar-template">
  <aside id="rail" aria-label="제작 일력">
    <div class="u2"></div><div class="u1"></div>
    <div class="bind"><i></i><b>NEXT YEAR ROBOTICS</b><i></i></div>
    <div class="torn"></div>
    <div class="page" id="page">
      <div class="dt"><div class="dd" id="calDay"></div><div><div class="ym" id="calTop"></div><div class="dn"><b id="rDn"></b>종잣돈을 넣은 날부터</div></div></div>
      <div class="wal"><span class="lab">지갑</span><span id="rBal"></span></div>
      <div><div class="gauge"><div class="fill" id="mfill"></div><div class="gh" id="mgh"></div><div class="z" id="m0"></div></div>
        <div class="gl" id="gl"></div></div>
      <div id="tx"></div>
      <div><svg id="chart" viewBox="0 0 328 78" aria-hidden="true"></svg><div id="chLg"></div></div>
      <div id="caps"></div>
      <div class="rv"><span class="ph" id="isoPh"></span><img id="isoA" alt=""><img id="isoB" alt=""><div class="nm"><span id="stName"></span><span id="stChg"></span></div></div>
      <div class="bot" id="rbot"></div>
    </div>
  </aside>
  </template>
  <footer class="story-footer"><a href="../#maknae">Next Year Robotics</a><a href="https://github.com/next-year-robotics/mobile-robot">막내 소스 코드 ↗</a></footer>
  <script type="module">
    import('./renderer.js').catch(error => {
      const status = document.getElementById('story-status');
      if (status) status.textContent = '제작 기록을 불러오지 못했습니다. 새로고침해 주세요.';
      console.error(error);
    });
  </script>
</body>
</html>
